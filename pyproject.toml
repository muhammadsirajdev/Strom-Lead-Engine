[project]
name = "strom-lead-engine"
version = "0.1.0"
description = "Storm-triggered roofing lead engine: weather monitoring to booked inspection, with a human-review gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Scheduling -- backend/scheduler.py
    "apscheduler>=3.11.3",
    # Agent framework + graph runtime -- agents/
    "langchain==1.3.2",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai>=1.4.1",
    "langgraph==1.2.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "openai>=2.48.0",
    # MCP -- the four servers in agents/runtime/mcp_client.py
    "composio-langchain>=0.15.0",
    "mcp==1.28.1",
    # Dashboard API -- backend/
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    # Postgres -- customers/tracking tables and the LangGraph checkpointer
    "psycopg-pool==3.3.1",
    "psycopg[binary]==3.3.4",
    # Shared
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "python-dotenv==1.2.2",
]

# Not needed to run the pipeline or the dashboard -- only to open and execute
# the exploration notebooks in notebook/, which predate agents/ and still use
# Groq as their LLM.
#
#   uv sync            installs these too (dev is uv's default group)
#   uv sync --no-dev   production install: runtime dependencies only
[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "langchain-groq==1.1.3",
]
