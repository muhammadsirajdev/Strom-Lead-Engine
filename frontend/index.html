<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>StormLead - Connect Gmail</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  #status { padding: 0.75rem 1rem; border-radius: 8px; margin: 1rem 0; font-size: 0.95rem; }
  #status.connected { background: #e6f4ea; color: #1e4620; }
  #status.disconnected { background: #fdecea; color: #611a15; }
  #status.checking { background: #f1f1f1; color: #444; }
  button { background: #1a73e8; color: #fff; border: none; padding: 0.65rem 1.25rem;
           border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
  button:hover { background: #1558b0; }
  #error { color: #b3261e; font-size: 0.9rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>StormLead - Sender Mailbox</h1>
  <p>Connect the Gmail account the agent should send storm-outreach emails from.</p>

  <div id="status" class="checking">Checking connection status...</div>
  <button id="connect-btn">Connect Gmail</button>
  <div id="error"></div>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    async function refreshStatus() {
      try {
        const res = await fetch("/auth/google/status");
        const data = await res.json();
        if (data.connected) {
          statusEl.textContent = `Connected as ${data.email}`;
          statusEl.className = "connected";
          document.getElementById("connect-btn").textContent = "Reconnect / Switch Account";
        } else {
          statusEl.textContent = "No Gmail account connected";
          statusEl.className = "disconnected";
        }
      } catch (err) {
        statusEl.textContent = "Could not reach backend";
        statusEl.className = "disconnected";
      }
    }

    document.getElementById("connect-btn").addEventListener("click", () => {
      window.location.href = "/auth/google/login";
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      errorEl.textContent = `Google returned an error: ${params.get("error")}`;
    }

    refreshStatus();
  </script>
</body>
</html>
